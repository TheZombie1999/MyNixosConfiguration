name: deploy

on:
  push:
    branches:
      - master

jobs:
  deploy:
    runs-on: native
    steps:
      - uses: actions/checkout@v4

      - name: Set up deploy SSH key
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "${{ secrets.DEPLOY_SSH_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          cat > ~/.ssh/config <<'EOF'
          Host *
            IdentitiesOnly yes
            IdentityFile ~/.ssh/id_ed25519
            StrictHostKeyChecking accept-new
            UserKnownHostsFile ~/.ssh/known_hosts

          # Bare mDNS hostname used by deploy.nodes.nixos-onedev in flake.nix
          # -- microstar has no mDNS resolver, unlike the workstations that
          # normally run these deploys.
          Host nixos-onedev
            HostName 192.168.178.103
          EOF
          chmod 600 ~/.ssh/config
          # Overwrite, not append: $HOME is a persistent StateDirectory, not
          # ephemeral per-run, so a stale/mismatched entry from an earlier
          # run would make accept-new refuse the connection outright instead
          # of accepting the (correct) freshly-scanned key.
          # One call per host, not a single batched invocation -- scanning
          # three targets (one of them a WAN IPv6 round-trip) at once was
          # racing/timing out for some of them, silently dropping their key
          # line while still printing the banner comment.
          : > ~/.ssh/known_hosts
          for host in 192.168.178.100 192.168.178.103 2a01:4f8:1c1c:8a66::1; do
            ssh-keyscan -T 10 -H "$host" >> ~/.ssh/known_hosts 2>/dev/null
          done

      # `nix copy` (deploy-rs's "Copying profile" step) makes its own ssh
      # calls that don't reliably pick up ~/.ssh/config -- NIX_SSHOPTS is the
      # mechanism nix itself reads, so set it explicitly on every deploy step
      # rather than relying on $GITHUB_ENV persisting it across steps.
      #
      # One host's failure shouldn't block the others -- each step is
      # independent, so check the run's summary for which ones actually
      # landed.
      - name: Deploy microstar
        continue-on-error: true
        run: |
          export NIX_SSHOPTS="-o IdentitiesOnly=yes -o IdentityFile=$HOME/.ssh/id_ed25519 -o UserKnownHostsFile=$HOME/.ssh/known_hosts -o StrictHostKeyChecking=accept-new"
          nix develop --command deploy .#microstar --skip-checks

      - name: Deploy nixos-onedev
        continue-on-error: true
        run: |
          export NIX_SSHOPTS="-o IdentitiesOnly=yes -o IdentityFile=$HOME/.ssh/id_ed25519 -o UserKnownHostsFile=$HOME/.ssh/known_hosts -o StrictHostKeyChecking=accept-new"
          nix develop --command deploy .#nixos-onedev --skip-checks

      - name: Deploy hetzner-nbg1
        continue-on-error: true
        # No rollback: hetzner's magic/auto-rollback both need a second SSH
        # round-trip from the box back to the deployer, which it can't
        # reliably make (see justfile's deploy-hetzner-nbg1).
        run: |
          export NIX_SSHOPTS="-o IdentitiesOnly=yes -o IdentityFile=$HOME/.ssh/id_ed25519 -o UserKnownHostsFile=$HOME/.ssh/known_hosts -o StrictHostKeyChecking=accept-new"
          nix develop --command deploy .#hetzner-nbg1 --skip-checks --auto-rollback false --magic-rollback false
