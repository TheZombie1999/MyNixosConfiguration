name: bootstrap-iso

on:
  push:
    paths:
      - Images/bootstrap-iso.nix
      - .forgejo/workflows/bootstrap-iso.yml
  workflow_dispatch:

jobs:
  build:
    runs-on: native
    steps:
      - uses: actions/checkout@v4
      - name: Build bootstrap ISO
        run: nix build .#nixosConfigurations.bootstrap-iso.config.system.build.isoImage --out-link iso-result
      - name: Upload ISO artifact
        # v4+ refuses to run against anything that isn't github.com itself;
        # Forgejo's artifact server only speaks the older (v3) protocol.
        uses: actions/upload-artifact@v3
        with:
          name: bootstrap-iso
          path: iso-result/iso/*.iso
