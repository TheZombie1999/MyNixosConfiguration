
[mgr]
ratio = [ 1, 2, 2]
sort_by="natural"
show_hidden=true
# linemode = "size_and_mtime"

[[plugin.prepend_fetchers]]
url   = "*"
run   = "git"
group = "git"

[[plugin.prepend_fetchers]]
url   = "*/"
run   = "git"
group = "git"

[opener]
zellij = [
  { run = "yaziOpener %s", orphan = true, block = false },
]
zathura = [
  { run = "zathura %s", orphan = true, block = false },
]
nsxiv = [
  { run = "nsxiv %s", orphan = true, block = false },
]
mpv = [
  { run = "mpv %s", orphan = true, block = false },
]

[open]
prepend_rules = [
	{ mime = "text/*", use = "zellij" },
  { mime = "inode/x-empty", use = "zellij" },
	{ mime = "application/json", use = "zellij" },
	{ mime = "application/ld+json", use = "zellij" },
	{ mime = "application/x-sh", use = "zellij" },
	{ mime = "application/pdf", use = "zathura" },
	{ mime = "image/*", use = "nsxiv" },
	{ mime = "video/*", use = "mpv" },
]
